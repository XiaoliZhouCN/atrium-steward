<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChestSteward 仪表盘</title>
    <!-- 极简 CSS 框架 Pico.css -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <!-- 加载 Qt WebChannel 库 -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        body { padding: 2rem; }
        .color-swatch { width: 100px; height: 100px; border: 1px solid #ccc; }
        .btn-group { display: flex; gap: 1rem; margin: 1rem 0; }
    </style>
</head>
<body>
    <main class="container">
        <h1>🎯 ChestSteward</h1>
        <p>Phase 2: Qt WebChannel 通信已打通。</p>

        <!-- 测试按钮区域 -->
        <div class="btn-group">
            <button id="ping-btn" class="primary">Ping Python</button>
            <button id="pick-color-btn">取色（模拟）</button>
        </div>

        <!-- 显示来自 Python 的消息 -->
        <div id="greeting" style="margin-top: 1rem; padding: 0.5rem; background: #f0f0f0; border-radius: 4px;">
            等待操作...
        </div>

        <hr>

        <!-- 取色器预览 -->
        <h2>取色器预览</h2>
        <div class="grid">
            <div>
                <div class="color-swatch" style="background-color: #cccccc;"></div>
                <p>R: <span id="r">0.0000</span></p>
                <p>G: <span id="g">0.0000</span></p>
                <p>B: <span id="b">0.0000</span></p>
            </div>
            <div>
                <p><em>点击“取色（模拟）”按钮，将更新上方色块和数值。</em></p>
                <p><em>后续将替换为真实的屏幕取色数据。</em></p>
            </div>
        </div>
    </main>

    <script>
        // 等待 DOM 完全加载后初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 检查 QWebChannel 是否可用
            if (typeof QWebChannel === 'undefined') {
                console.error("QWebChannel is not defined. Please check qwebchannel.js loading.");
                document.getElementById('greeting').innerHTML = "❌ 错误：QWebChannel 未加载，请检查 Qt 环境。";
                return;
            }

            // 创建 QWebChannel 实例
            new QWebChannel(qt.webChannelTransport,
                function(channel) {
                    // 获取 bridge 对象
                    var bridge = channel.objects.bridge;
                    if (!bridge) {
                        console.error("Failed to obtain bridge object.");
                        document.getElementById('greeting').innerHTML = "❌ 错误：无法获取 bridge 对象。";
                        return;
                    }
                    console.log("Bridge object obtained successfully.");

                    // 监听来自 Python 的消息
                    bridge.messageSent.connect(function(message) {
                        console.log("Received from Python:", message);
                        // 更新消息显示区域
                        document.getElementById('greeting').innerHTML = "📩 " + message;

                        // 尝试解析为 JSON（颜色数据）
                        try {
                            var data = JSON.parse(message);
                            if (data.r !== undefined && data.g !== undefined && data.b !== undefined) {
                                var r = Math.round(data.r * 255);
                                var g = Math.round(data.g * 255);
                                var b = Math.round(data.b * 255);
                                var color = `rgb(${r}, ${g}, ${b})`;
                                document.querySelector('.color-swatch').style.backgroundColor = color;
                                document.getElementById('r').innerText = data.r.toFixed(4);
                                document.getElementById('g').innerText = data.g.toFixed(4);
                                document.getElementById('b').innerText = data.b.toFixed(4);
                            }
                        } catch(e) {
                            // 不是 JSON，忽略
                        }
                    });

                    // 绑定 Ping 按钮
                    document.getElementById('ping-btn').addEventListener('click', function() {
                        bridge.ping();
                    });

                    // 绑定取色按钮
                    document.getElementById('pick-color-btn').addEventListener('click', function() {
                        // 传递一个示例坐标（后续替换为真实鼠标位置）
                        bridge.pick_color(100, 200);
                    });
                }
            );
        });
    </script>
</body>
</html>
